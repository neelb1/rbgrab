name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: rbgrab-windows-x64.zip
          - os: macos-latest
            asset: rbgrab-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m rbgrab.icon assets/icon.png
      - run: pyinstaller --noconfirm rbgrab.spec
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/rbgrab -DestinationPath ${{ matrix.asset }}
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/rbgrab.app ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
